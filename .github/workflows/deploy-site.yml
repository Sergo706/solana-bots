name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'

defaults:
  run:
    working-directory: web

jobs:
  type-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:fix

  cloudflare:
    needs: type-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install & Build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          accountId: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name solana-bots-web