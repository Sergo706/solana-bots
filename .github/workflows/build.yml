name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      skip_upload:
        description: 'Skip R2 upload'
        required: false
        default: false
        type: boolean

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION_STR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        run: npm ci

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Run build script
        run: bash build.sh
        env:
          BUMP: ${{ inputs.bump }}
          R2_SKIP_UPLOAD: '1'

      - name: Extract version
        id: version
        run: |
          VERSION_STR=$(ls -d build/ui/*/ 2>/dev/null | grep -oE 'V[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          echo "VERSION_STR=${VERSION_STR:-V1.0.0}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/

  build-ui-windows:
    runs-on: windows-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build workers
        working-directory: ui
        run: npm run build:workers

      - name: Make Windows installer
        working-directory: ui
        run: npx electron-forge make --platform=win32 --arch=x64 --targets=@electron-forge/maker-squirrel
        env:
          DEBUG: 'electron-windows-installer*'

      - name: Collect Windows artifacts
        shell: bash
        run: |
          VERSION_STR="${{ needs.build-linux.outputs.version }}"
          mkdir -p build/ui/win32-x64-${VERSION_STR}
          cp -r ui/out/make/squirrel.windows/x64/* build/ui/win32-x64-${VERSION_STR}/ || true

      - name: Upload Windows UI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/

  upload:
    needs: [build-linux, build-ui-windows]
    if: ${{ !inputs.skip_upload }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: build/

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: build-win/

      - name: Merge artifacts
        run: |
          cp -rn build-win/* build/ || true
          ls -laR build/

      - name: Upload to R2
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          VERSION_STR="${{ needs.build-linux.outputs.version }}"
          R2_PREFIX="releases/${VERSION_STR}"

          curl -fsSL https://rclone.org/install.sh | sudo bash

          export RCLONE_CONFIG_R2_TYPE=s3
          export RCLONE_CONFIG_R2_PROVIDER=Cloudflare
          export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$CLOUDFLARE_R2_ACCESS_KEY_ID"
          export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
          export RCLONE_CONFIG_R2_ENDPOINT="https://${CLOUDFLARE_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export RCLONE_CONFIG_R2_REGION="auto"
          export RCLONE_CONFIG_R2_NO_CHECK_BUCKET="true"
          export RCLONE_CONFIG_R2_FORCE_PATH_STYLE="true"

          echo ""
          echo "Uploading build artifacts to R2..."
          echo "  Bucket : ${CLOUDFLARE_R2_BUCKET}"
          echo "  Prefix : ${R2_PREFIX}"
          echo ""

          rclone copy build/ "r2:${CLOUDFLARE_R2_BUCKET}/${R2_PREFIX}" --progress --no-traverse
