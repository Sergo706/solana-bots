name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      skip_upload:
        description: 'Skip R2 upload'
        required: false
        default: false
        type: boolean

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION_STR }}
      new_version: ${{ steps.version.outputs.NEW_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        run: npm ci

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Run build script
        run: bash build.sh
        env:
          BUMP: ${{ inputs.bump }}
          R2_SKIP_UPLOAD: '1'

      - name: Extract version
        id: version
        run: |
          VERSION_STR=$(ls -d build/ui/*/ 2>/dev/null | grep -oE 'V[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          VERSION_STR="${VERSION_STR:-V1.0.0}"
          NEW_VERSION="${VERSION_STR#V}"
          echo "VERSION_STR=${VERSION_STR}" >> "$GITHUB_OUTPUT"
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/

  build-windows:
    runs-on: windows-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        run: npm ci

      - name: Build CLI
        run: |
          npx tsdown
          npx drizzle-kit generate
          cp -r src/db/migrations dist/migrations
          npm run compile:windows
          cp -r dist/migrations build/migrations
        shell: bash

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build workers
        working-directory: ui
        run: npm run build:workers

      - name: Package Windows UI
        working-directory: ui
        run: npx electron-forge package --platform=win32 --arch=x64


      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Inno Setup installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="${{ needs.build-linux.outputs.new_version }}" /O"build\windows-installer-${{ needs.build-linux.outputs.version }}" installer.iss

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows-installer-*/

  upload:
    needs: [build-linux, build-windows]
    if: ${{ !inputs.skip_upload }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: build/

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: build/

      - name: List final artifacts
        run: ls -laR build/

      - name: Upload to R2
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          VERSION_STR="${{ needs.build-linux.outputs.version }}"
          R2_PREFIX="releases/${VERSION_STR}"

          curl -fsSL https://rclone.org/install.sh | sudo bash

          export RCLONE_CONFIG_R2_TYPE=s3
          export RCLONE_CONFIG_R2_PROVIDER=Cloudflare
          export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$CLOUDFLARE_R2_ACCESS_KEY_ID"
          export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
          export RCLONE_CONFIG_R2_ENDPOINT="https://${CLOUDFLARE_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export RCLONE_CONFIG_R2_REGION="auto"
          export RCLONE_CONFIG_R2_NO_CHECK_BUCKET="true"
          export RCLONE_CONFIG_R2_FORCE_PATH_STYLE="true"

          echo ""
          echo "Uploading build artifacts to R2..."
          echo "  Bucket : ${CLOUDFLARE_R2_BUCKET}"
          echo "  Prefix : ${R2_PREFIX}"
          echo ""

          rclone copy build/ "r2:${CLOUDFLARE_R2_BUCKET}/${R2_PREFIX}" --progress --no-traverse
